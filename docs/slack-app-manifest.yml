# Paste this at https://api.slack.com/apps → Create New App → From an app manifest.
# Replace APP_URL with the Vercel address (e.g. https://fomo-overtime.vercel.app) in the four places below.
display_information:
  name: FOMO Overtime
  description: Post, claim and track overtime slots
  background_color: "#111111"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Overtime
    always_online: true
  slash_commands:
    - command: /overtime
      url: APP_URL/api/slack/commands
      description: Post an overtime slot, or "/overtime me" to see yours
      usage_hint: "[me]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - users:read
      - users:read.email
      - im:write
settings:
  event_subscriptions:
    request_url: APP_URL/api/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: APP_URL/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
